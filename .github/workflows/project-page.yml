name: Deploy FrontierDrive project page

on:
  push:
    branches: [main]
    paths:
      - 'assets/project-page/**'
      - 'assest/**'
      - '.github/workflows/project-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontierdrive-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website sources
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check assets/project-page/app.js
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Package and verify website
        run: python3 assets/project-page/build.py --output _site --base-url "$PAGES_BASE_URL"
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
